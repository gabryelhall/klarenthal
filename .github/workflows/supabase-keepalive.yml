# Wöchentlicher Mini-Aufruf ans Backend, damit das kostenlose Supabase-Projekt
# nicht wegen Inaktivität pausiert wird. Der Publishable-Key ist öffentlich —
# geschützt wird über die RLS-Regeln, nicht über den Key.
# Hinweis: GitHub deaktiviert geplante Workflows, wenn das Repository rund
# 60 Tage keine Aktivität hatte — dann unter "Actions" wieder aktivieren.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sSf "https://pifhwbxqizuayobkbswu.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_FGO0rFjpnBfPiX5ELhf_Hw_27hfPw1x" > /dev/null
